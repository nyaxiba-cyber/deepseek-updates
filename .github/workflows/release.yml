name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare publish files
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v$(grep -oP 'versionName\s*=\s*\"\K[^\"]+' app/build.gradle.kts | head -1)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NOTES=$(gh api "repos/${{ github.repository }}/releases" --jq '.[0].body' 2>/dev/null || echo "Auto release")
          mkdir -p publish
          cp app/build/outputs/apk/debug/app-debug.apk "publish/app-debug-v${TAG}.apk"
          cat > publish/version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${TAG}",
            "updateNotes": "${NOTES}",
            "downloadUrl": "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/publish/app-debug-v${TAG}.apk",
            "force": false
          }
          EOF
          # 清理旧版 APK（保留最新）
          ls publish/app-debug-v*.apk | grep -v "v${TAG}.apk" | xargs -r rm -f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            publish/app-debug-v*.apk
            publish/version.json

      - name: Commit publish files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish
          git commit -m "publish ${{ env.TAG }}" || echo "nothing to commit"
          git push origin HEAD:main
